{% extends "base_dashboard.html" %}

{% block title %}Кабинет менеджера{% endblock %}

{% block content %}
<div class="dashboard">
    <h1>📊 Управление заказами</h1>

    <div class="dashboard-tabs">
        <button class="tab-btn active" onclick="showTab('orders')">Заказы</button>
        <button class="tab-btn" onclick="showTab('completed')">Выполненные</button>
        <button class="tab-btn" onclick="showTab('services')">Услуги</button>
        <button class="tab-btn" onclick="showTab('engineers')">Инженеры</button>
    </div>

    <div id="ordersTab" class="tab-content active">
        <div class="dashboard-actions">
            <button onclick="loadAllOrders()" class="btn-secondary">🔄 Обновить</button>
        </div>
        <div id="ordersContainer" class="orders-grid"></div>
    </div>

    <div id="completedTab" class="tab-content">
        <h2>✅ Выполненные заказы</h2>
        <div id="completedOrdersContainer" class="orders-grid"></div>
    </div>
    
    <div id="servicesTab" class="tab-content">
        <h2>🔧 Управление услугами</h2>
        <form id="createServiceForm" class="inline-form">
            <input type="text" id="serviceName" placeholder="Название услуги" required>
            <input type="number" id="servicePrice" placeholder="Цена (₽)" required>
            <button type="submit" class="btn-primary">Добавить</button>
        </form>
        <div id="servicesContainer" class="services-list"></div>
    </div>
    
    <div id="engineersTab" class="tab-content">
        <h2>👨‍🔧 Инженеры</h2>
        <div id="engineersContainer" class="engineers-list"></div>
    </div>
</div>

<!-- Модальное окно назначения инженера -->
<div id="assignModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('assignModal')">&times;</span>
        <h2>👤 Назначить инженера</h2>
        <form id="assignForm">
            <input type="hidden" id="assignOrderId">
            <div class="form-group">
                <label for="engineerId">Выберите инженера</label>
                <select id="engineerId" name="engineer_id" required>
                    <!-- Инженеры загружаются через JS -->
                </select>
            </div>
            <button type="submit" class="btn-primary">Назначить</button>
        </form>
    </div>
</div>

<!-- Модальное окно смены статуса -->
<div id="statusModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('statusModal')">&times;</span>
        <h2>📝 Изменить статус заказа</h2>
        <form id="statusForm">
            <input type="hidden" id="statusOrderId">
            <div class="form-group">
                <label for="status">Статус</label>
                <select id="status" name="status" required>
                    <option value="new">🆕 Новый</option>
                    <option value="accepted">✅ Принят</option>
                    <option value="in_progress">🔧 В работе</option>
                    <option value="ready">✨ Готов</option>
                    <option value="shipped">📦 Отправлен</option>
                    <option value="delivered">✅ Получен клиентом</option>
                    <option value="cancelled">❌ Отменен</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Проверка валидности токена при загрузке
async function validateToken() {
    try {
        const response = await fetch('/api/auth/me', {
            credentials: 'include'
        });
        if (!response.ok) {
            localStorage.removeItem('user_role');
            localStorage.removeItem('user_email');
            window.location.href = '/login';
        }
    } catch (error) {
        localStorage.removeItem('user_role');
        localStorage.removeItem('user_email');
        window.location.href = '/login';
    }
}

// Вызываем проверку сразу
validateToken();

function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabName + 'Tab').classList.add('active');
    event.target.classList.add('active');

    if (tabName === 'orders') loadAllOrders();
    if (tabName === 'completed') loadCompletedOrders();
    if (tabName === 'services') loadServices();
    if (tabName === 'engineers') loadEngineers();
}

async function loadAllOrders() {
    try {
        const response = await fetch('/api/orders/', {
            credentials: 'include'
        });

        const orders = await response.json();
        // Фильтруем только активные заказы (не доставленные и не отмененные)
        const activeOrders = orders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled');
        renderOrders(activeOrders);
    } catch (error) {
        showNotification('Ошибка загрузки заказов', 'error');
    }
}

async function loadCompletedOrders() {
    try {
        const response = await fetch('/api/orders/', {
            credentials: 'include'
        });

        const orders = await response.json();
        // Фильтруем только выполненные (доставленные) заказы
        const completedOrders = orders.filter(o => o.status === 'delivered');
        renderCompletedOrders(completedOrders);
    } catch (error) {
        showNotification('Ошибка загрузки заказов', 'error');
    }
}

function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');

    container.innerHTML = orders.map(order => `
        <div class="order-card status-${order.status}">
            <div class="order-header">
                <h3>Заказ #${order.id}</h3>
                <span class="status-badge">${translateStatus(order.status)}</span>
            </div>
            <p class="order-description">${order.description}</p>
            <div class="order-meta">
                <span>👤 Клиент: ${order.client_id}</span>
                <span>🔧 Инженер: ${order.engineer_id || 'Не назначен'}</span>
                <span>📅 ${new Date(order.created_at).toLocaleDateString()}</span>
            </div>
            <div class="order-actions">
                <button onclick="openAssignModal(${order.id})" class="btn-primary">
                    ${order.engineer_id ? 'Изменить инженера' : 'Назначить инженера'}
                </button>
                <button onclick="openStatusModal(${order.id}, '${order.status}')" class="btn-secondary">📝 Статус</button>
                <button onclick="deleteOrder(${order.id})" class="btn-danger">🗑 Удалить</button>
            </div>
        </div>
    `).join('');
}

function renderCompletedOrders(orders) {
    const container = document.getElementById('completedOrdersContainer');

    if (orders.length === 0) {
        container.innerHTML = '<p class="empty-state">Нет выполненных заказов</p>';
        return;
    }

    container.innerHTML = orders.map(order => `
        <div class="order-card status-${order.status}">
            <div class="order-header">
                <h3>Заказ #${order.id}</h3>
                <span class="status-badge">${translateStatus(order.status)}</span>
            </div>
            <p class="order-description">${order.description}</p>
            <div class="order-meta">
                <span>👤 Клиент: ${order.client_id}</span>
                <span>🔧 Инженер: ${order.engineer_id || 'Не назначен'}</span>
                <span>📅 ${new Date(order.created_at).toLocaleDateString()}</span>
            </div>
        </div>
    `).join('');
}

async function loadServices() {
    try {
        const response = await fetch('/api/services/');
        const services = await response.json();
        
        const container = document.getElementById('servicesContainer');
        container.innerHTML = services.map(service => `
            <div class="service-item">
                <span>${service.name} - ${service.price}₽</span>
                <button onclick="deleteService(${service.id})" class="btn-danger">Удалить</button>
            </div>
        `).join('');
    } catch (error) {
        showNotification('Ошибка загрузки услуг', 'error');
    }
}

document.getElementById('createServiceForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('serviceName').value;
    const price = parseInt(document.getElementById('servicePrice').value);

    try {
        const response = await fetch('/api/services/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ name, price })
        });

        if (response.ok) {
            showNotification('Услуга добавлена!', 'success');
            loadServices();
        } else {
            const data = await response.json();
            showNotification(data.detail || 'Ошибка', 'error');
        }
    } catch (error) {
        showNotification('Ошибка подключения', 'error');
    }
});

async function deleteService(serviceId) {
    if (!confirm('Вы уверены?')) return;

    try {
        const response = await fetch(`/api/services/${serviceId}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (response.ok) {
            showNotification('Услуга удалена!', 'success');
            loadServices();
        } else {
            showNotification('Ошибка удаления', 'error');
        }
    } catch (error) {
        showNotification('Ошибка подключения', 'error');
    }
}

async function loadEngineers() {
    try {
        const response = await fetch('/api/users/', {
            credentials: 'include'
        });

        const users = await response.json();
        const engineers = users.filter(u => u.role === 'engineer');

        const container = document.getElementById('engineersContainer');
        container.innerHTML = engineers.map(engineer => `
            <div class="engineer-item">
                <span>👤 ${engineer.email}</span>
                <span class="status-indicator">🟢 Активен</span>
            </div>
        `).join('');

        // Заполняем select для назначения
        const select = document.getElementById('engineerId');
        select.innerHTML = engineers.map(e =>
            `<option value="${e.id}">${e.email}</option>`
        ).join('');
    } catch (error) {
        showNotification('Ошибка загрузки инженеров', 'error');
    }
}

function openAssignModal(orderId) {
    document.getElementById('assignOrderId').value = orderId;
    document.getElementById('assignModal').style.display = 'block';
    loadEngineers();
}

document.getElementById('assignForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const orderId = document.getElementById('assignOrderId').value;
    const engineer_id = parseInt(document.getElementById('engineerId').value);

    try {
        const response = await fetch(`/api/orders/${orderId}/assign`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ engineer_id })
        });

        if (response.ok) {
            showNotification('Инженер назначен!', 'success');
            closeModal('assignModal');
            loadAllOrders();
        } else {
            const data = await response.json();
            showNotification(data.detail || 'Ошибка', 'error');
        }
    } catch (error) {
        showNotification('Ошибка подключения', 'error');
    }
});

function openStatusModal(orderId, currentStatus) {
    document.getElementById('statusOrderId').value = orderId;
    document.getElementById('status').value = currentStatus;
    document.getElementById('statusModal').style.display = 'block';
}

document.getElementById('statusForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const orderId = document.getElementById('statusOrderId').value;
    const status = document.getElementById('status').value;

    try {
        const response = await fetch(`/api/orders/${orderId}/status`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ status })
        });

        if (response.ok) {
            showNotification('Статус обновлён!', 'success');
            closeModal('statusModal');
            loadAllOrders();
        } else {
            const data = await response.json();
            showNotification(data.detail || 'Ошибка', 'error');
        }
    } catch (error) {
        showNotification('Ошибка подключения', 'error');
    }
});

async function deleteOrder(orderId) {
    if (!confirm('Вы уверены, что хотите удалить этот заказ?')) return;

    try {
        const response = await fetch(`/api/orders/${orderId}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (response.ok) {
            showNotification('Заказ удалён!', 'success');
            loadAllOrders();
        } else {
            const data = await response.json();
            showNotification(data.detail || 'Ошибка удаления', 'error');
        }
    } catch (error) {
        showNotification('Ошибка подключения', 'error');
    }
}

function translateStatus(status) {
    const statuses = {
        'new': '🆕 Новый',
        'accepted': '✅ Принят',
        'in_progress': '🔧 В работе',
        'ready': '✨ Готов',
        'shipped': '📦 Отправлен',
        'delivered': '✅ Получен клиентом',
        'cancelled': '❌ Отменен'
    };
    return statuses[status] || status;
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

window.addEventListener('load', () => {
    loadAllOrders();
});
</script>
{% endblock %}
